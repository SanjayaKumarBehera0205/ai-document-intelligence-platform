services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://documents:documents@db:5432/documents
      SECRET_KEY: development-only-change-me
      STORAGE_DIR: /app/uploads
      CELERY_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    volumes: [document_uploads:/app/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment: *app-env
    volumes: [document_uploads:/app/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  document_uploads:
